# ==============================================================================
# Configuration for wordflow CLI
# Default Location: ~/.config/wordflow/config.toml
# ==============================================================================
# ------------------------------------------------------------------------------
[global]
# ISO 639-1 language codes (e.g., "en", "zh", "nl", "fr", "es")
source_language = "auto" # translate from
target_language = "en" # translate to

# Send system notifications
enable_notifications = true

[translator]
# Supported engines: 
# "GoogleTranslator",
# "MyMemoryTranslator",
# "LingueeTranslator",
# "PonsTranslator",
# "DeeplTranslator",
# "ChatGptTranslator",
# "MicrosoftTranslator",
# "YandexTranslator",
# "QcriTranslator",
translator_name = "GoogleTranslator"

# Required for paid/authenticated APIs (DeepL, OpenAI, etc.)
# leave blank if you don't need it
api_key = ""

# Base URL for self-hosted instances
# leave blank if you don't need it
api_base_url = ""

# Engine-specific model selection
# leave blank if you don't need it
engine_model = ""

# ------------------------------------------------------------------------------
# DEFAULT ANKI CONFIGURATION
# Used by default for all languages unless language-based overrides are specified 
# ------------------------------------------------------------------------------
[anki]
[anki.default]
# default AnkiConnect URL
url = "http://localhost:8765"

# Target deck name. 
# Supports dynamic placeholders: {source_language}, {target_language}
# Example: "Languages::{source_language}" creates cards in the deck: "Languages::es"
deck = "Languages::{source_language}"

# The name of the note model in Anki
card_model = "wordflow cloze"

# Allow duplicate cards if the same word/cloze already exists in the deck?
allow_duplicates = false

# Default tags automatically attached to every card added by this tool
tags = ["wordflow", "auto-generated"]

# Map <internal_field_name> = "<anki_field_name>"
[anki.default.fields]
front_field_name = "front"
back_field_name = "translation"
extra_field_name = "additional notes"


# ------------------------------------------------------------------------------
# LANGUAGE-SPECIFIC OVERRIDES
# Triggered when passing -l/--lang <language_iso_code>
# ------------------------------------------------------------------------------

# Override for Chinese (-l zh)
[anki.zh]
deck = "Languages::Chinese"
card_model = "Chinese Hanzi Cloze"

[anki.zh.fields]
front_field_name = "Hanzi"
back_field_name = "Pinyin_Translation"
extra_field_name = "Stroke_Order"

# Override for Dutch (-l nl)
[anki.nl]
deck = "Languages::Dutch"
# fields fall back to [anki.default.fields] automatically


