# ==============================================================================
# Configuration for Wordpipe CLI
# Default Location: ~/.config/wordpipe/config.toml
# ==============================================================================

[languages]
# ISO 639-1 language codes (e.g., "en", "zh", "nl", "fr", "es")
native_language = "en"
target_language = "es"

[translator]
# Supported engines: 
# "GoogleTranslator",
# "MyMemoryTranslator",
# "LingueeTranslator",
# "PonsTranslator",
# "DeeplTranslator",
# "ChatGptTranslator",
# "MicrosoftTranslator",
# "YandexTranslator",
# "QcriTranslator",
translator = "GoogleTranslator"

# Required for paid/authenticated APIs (DeepL, OpenAI, etc.)
# leave blank if you don't need it
api_key = ""

# Base URL for self-hosted instances
# leave blank if you don't need it
api_base_url = ""

# Engine-specific model selection
# leave blank if you don't need it
engine_model = ""

[anki]
# default AnkiConnect URL
url = "http://localhost:8765"

# Target deck name. 
# Supports dynamic placeholders: {target_language}, {native_language}
# Example: "Languages::{target_language}" creates cards in the deck: "Languages::es"
deck = "Languages::{target_language}"

# Allow duplicate cards if the same word/cloze already exists in the deck?
allow_duplicates = false

# Default tags automatically attached to every card added by this tool
tags = ["wordpipe", "auto-generated"]

[anki.note_type]
# The name of the note model in Anki
card_model = "Wordpipe Cloze"

# Automatically create the note model if it doesn't exist in Anki
auto_create = true

# Field mappings matching your Anki note type fields
# Map <internal_field_name> = "<anki_field_name>"
[anki.fields]
front = "front"
translation = "translation"
additional_notes = "additional notes"

[cli]
# Ask for confirmation before adding the card to Anki (interactive prompt)
confirm_before_add = true

# Send system notifications (via libnotify / notify-send on Linux) upon card creation/failure
enable_notifications = true

# Automatically read target text from system clipboard if no text is passed as CLI argument
use_clipboard = true
